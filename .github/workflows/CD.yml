name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes (rolling update)
        run: kubectl apply -f k8s/

      - name: Wait for rollout to finish
        run: kubectl rollout status deployment/weather-ml-app --timeout=300s

      - name: Show running pods
        run: kubectl get pods -o wide
