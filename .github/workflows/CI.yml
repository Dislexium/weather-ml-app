name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/weather-ml-app
  TAG: v1

jobs:
  build-test-ship:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flask and dependencies
        run: pip install -r requirements.txt

      - name: Run smoke test
        run: python -m unittest -v tests/smoke_test.py

      - name: Run unit test
        run: python -m unittest -v tests/unit_test.py

      - name: Run integration test
        run: python -m unittest -v tests/integration_test.py

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t $IMAGE:$TAG .

      - name: Build test - launch container
        run: |
          docker run -d --name test-app -p 5000:5000 $IMAGE:$TAG
          sleep 15
          docker ps --filter name=test-app --filter status=running | grep test-app
          docker exec test-app python --version
          docker logs test-app

      - name: Docker Login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: docker push $IMAGE:$TAG
